name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "optimize/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14.4
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Verify runtime and native imports
        run: |
          python --version
          python -c "import asyncio; asyncio.set_event_loop(asyncio.new_event_loop()); import aiogram, aiohttp, numpy, cv2, PIL, imagehash, pymongo, motor, pyrogram; print('Python 3.14 runtime imports OK')"
