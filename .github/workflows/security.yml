name: V3 Security Scan

on:
  push:
    branches:
      - Adding-HelperV3
  pull_request:
    branches:
      - Adding-HelperV3

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner
        run: |
          pip install pip-audit

      - name: Dependency audit
        run: |
          pip-audit -r requirements.txt
