name: V3 Tests

on:
  push:
    branches:
      - Adding-HelperV3
  pull_request:
    branches:
      - Adding-HelperV3

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 isort

      - name: Import check
        run: |
          isort --check-only .

      - name: Style check
        run: |
          flake8 .

      - name: Run tests
        run: |
          pytest
