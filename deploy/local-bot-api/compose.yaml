services:
  telegram-bot-api:
    build:
      context: .
      args:
        TELEGRAM_BOT_API_REF: ${TELEGRAM_BOT_API_REF:-master}
    container_name: bika-telegram-bot-api
    restart: unless-stopped
    env_file:
      - .env
    user: "${BOT_API_UID:-1000}:${BOT_API_GID:-1000}"
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      # Host and container paths intentionally match so getFile() can return
      # a path that a host-running bot can read directly.
      - ${BOT_API_DATA_DIR:-/srv/telegram-bot-api/data}:${BOT_API_DATA_DIR:-/srv/telegram-bot-api/data}
    ports:
      - "127.0.0.1:8081:8081"
    command:
      - --api-id=${TELEGRAM_API_ID}
      - --api-hash=${TELEGRAM_API_HASH}
      - --local
      - --dir=${BOT_API_DATA_DIR:-/srv/telegram-bot-api/data}
      - --temp-dir=${BOT_API_DATA_DIR:-/srv/telegram-bot-api/data}/temp
      - --http-port=8081
      - --verbosity=1
