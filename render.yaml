services:
  - type: web
    name: bika-adding-lookup
    runtime: python
    branch: LookupV4
    buildCommand: pip install -r requirements.txt
    startCommand: python -m unified.main
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: RUN_MODE
        value: webhook
      - key: PUBLIC_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /webhook
      - key: WEBHOOK_SECRET
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: bika_adding_lookup
      - key: OWNER_IDS
        sync: false
      - key: ADDING_CHAT_ID
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: SOURCE_CHANNELS
        sync: false
      - key: INLINE_OUTPUT_CHAT_ID
        sync: false
      - key: HELPER_FORWARD_DELAY
        value: "1"
      - key: HELPER_MAX_HISTORY
        value: "500"
      - key: HELPER_INLINE_TIMEOUT
        value: "20"
      - key: AUTO_LOOKUP_ENABLED
        value: "true"
      - key: LOOKUP_IN_PRIVATE
        value: "true"
      - key: LOOKUP_IN_GROUPS
        value: "true"
      - key: LOOKUP_REPLY_NOT_FOUND
        value: "true"
      - key: LOOKUP_SQLITE_PATH
        value: data/lookup_index.sqlite3
      - key: LOOKUP_RAM_CACHE_MAX_ITEMS
        value: "5000"
      - key: LOOKUP_INDEX_SYNC_SECONDS
        value: "300"
      - key: AUTO_HASH_LOOKUP_ENABLED
        value: "true"
      - key: AUTO_HASH_TIMEOUT_SECONDS
        value: "10"
      - key: FORCE_JOIN_ENABLED
        value: "true"
      - key: FORCE_JOIN_CHANNELS
        sync: false
      - key: FORCE_JOIN_CACHE_TTL_SECONDS
        value: "60"
      - key: FORCE_JOIN_CACHE_MAX_USERS
        value: "10000"
      - key: FORCE_JOIN_BYPASS_AUTHORIZED
        value: "true"
      - key: MAX_PHOTO_CANDIDATES
        value: "1200"
      - key: MAX_VIDEO_CANDIDATES
        value: "1500"
