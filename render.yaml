services:
  - type: web
    name: bika-adding-lookup
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python unified/main.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: USE_WEBHOOK
        value: "true"
      - key: PUBLIC_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /webhook
      - key: WEBHOOK_SECRET
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: bika_adding_lookup
      - key: OWNER_IDS
        sync: false
      - key: ADDING_CHAT_ID
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: HELPER_TARGET_CHAT
        sync: false
      - key: LOOKUP_REPLY_NOT_FOUND
        value: "true"
