services:
  - type: web
    name: bika-adding-lookup
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python unified/main.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.4
      - key: RUN_MODE
        value: webhook
      - key: PUBLIC_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /webhook
      - key: WEBHOOK_SECRET
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: bika_adding_lookup
      - key: OWNER_IDS
        sync: false
      - key: ADDING_CHAT_ID
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: SOURCE_CHANNELS
        sync: false
      - key: INLINE_OUTPUT_CHAT_ID
        sync: false
      - key: HELPER_FORWARD_DELAY
        value: "1"
      - key: HELPER_MAX_HISTORY
        value: "500"
      - key: HELPER_INLINE_TIMEOUT
        value: "20"
